[project]
name = "telcom-revenue-at-risk-predictor"
version = "0.1.0"
description = "Predicting customer churn and estimating feedback-adjusted revenue at risk."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]
